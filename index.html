<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hamdi English Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4f46e5', primaryDark: '#4338ca' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Dekorasi Latar Belakang Modern -->
    <div class="absolute top-0 right-0 -mr-24 -mt-24 w-[28rem] h-[28rem] rounded-full bg-indigo-500/10 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 -ml-24 -mb-24 w-96 h-96 rounded-full bg-blue-500/10 blur-3xl pointer-events-none"></div>

    <!-- Container Utama Login -->
    <div class="bg-white/95 backdrop-blur-md p-8 sm:p-10 rounded-3xl shadow-[0_20px_50px_ rgba(15,23,42,0.06)] max-w-md w-full relative z-10 border border-slate-200/80 fade-in">
        
        <!-- Header Brand -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-600 to-indigo-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200 border border-indigo-500">
                <i class="fas fa-graduation-cap text-2xl text-white"></i>
            </div>
            <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-extrabold uppercase tracking-widest rounded-full border border-indigo-100 mb-2">
                Premium Portal
            </span>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Hamdi English Studio</h1>
            <p class="text-slate-500 font-medium text-xs sm:text-sm mt-1">Masuk untuk mengakses kelas dan modul eksklusif Anda</p>
        </div>

        <!-- Notifikasi Error -->
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 p-3.5 rounded-2xl mb-6 text-xs sm:text-sm flex items-center gap-3 font-medium animate-shake">
            <i class="fas fa-circle-exclamation text-base shrink-0"></i>
            <span id="login-error-text">Email atau kata sandi tidak valid. Silakan periksa kembali.</span>
        </div>

        <!-- Form Login -->
        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Alamat Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-slate-400 text-sm"></i>
                    </div>
                    <input type="email" id="email" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-600 focus:bg-white text-slate-800 placeholder-slate-400 outline-none transition-all text-sm font-medium" placeholder="nama@email.com" required autocomplete="email">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Kata Sandi</label>
                    <a href="https://wa.me/6282298363945" target="_blank" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">Lupa sandi?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-slate-400 text-sm"></i>
                    </div>
                    <input type="password" id="password" class="w-full pl-11 pr-11 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-600 focus:bg-white text-slate-800 placeholder-slate-400 outline-none transition-all text-sm font-medium" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors" title="Tampilkan Sandi">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl hover:bg-indigo-700 active:scale-[0.99] transition-all font-bold shadow-md shadow-indigo-200 flex items-center justify-center gap-2 text-sm mt-2">
                <span>Masuk ke Portal</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer Bantuan WhatsApp -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 mb-3 font-medium">Belum terdaftar sebagai member aktif?</p>
            <a href="https://wa.me/6282298363945" target="_blank" class="inline-flex items-center justify-center px-5 py-3 bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 text-slate-700 hover:text-emerald-700 rounded-xl font-bold transition-all w-full text-xs sm:text-sm group">
                <i class="fab fa-whatsapp text-emerald-500 text-lg mr-2 group-hover:scale-110 transition-transform"></i>
                Hubungi Admin via WhatsApp
            </a>
        </div>
    </div>

    <!-- Library Supabase & Script Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
