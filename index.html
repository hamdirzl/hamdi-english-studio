<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter (Lebih bersih dan modern dibanding Poppins untuk UI aplikasi) -->

<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900 font-inter">

    <!-- Halaman Login -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 bg-slate-50 relative overflow-hidden">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200 max-w-md w-full relative z-10">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <i class="fas fa-graduation-cap text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 mb-1 tracking-tight">Hamdi Studio</h1>
                <p class="text-slate-500 font-medium text-sm">Masuk ke portal belajar Anda</p>
            </div>
            
            <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 p-3 rounded-lg mb-6 text-sm text-center flex items-center justify-center font-medium">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span>Email atau password salah.</span>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-slate-400"></i>
                        </div>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm" placeholder="Masukkan email" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm" placeholder="••••••••" required>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="https://wa.me/6282298363945?text=Hi%20Bro%20Hamdi!%20Saya%20lupa%20password%20akun%20saya.%20Mohon%20bantuannya%20untuk%20reset." target="_blank" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors">
                            Lupa password?
                        </a>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition-all font-semibold shadow-sm mt-4 text-sm">
                    Masuk
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-sm text-slate-500 font-medium mb-3">Belum memiliki akun?</p>
                <a href="https://wa.me/6282298363945?text=Hi%20Bro%20Hamdi!%20Saya%20tertarik%20belajar%20dan%20ingin%20membuat%20akun." target="_blank" class="inline-flex items-center justify-center px-4 py-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-lg font-medium transition-colors w-full sm:w-auto text-sm">
                    <i class="fab fa-whatsapp text-green-500 text-lg mr-2"></i> Hubungi Admin
                </a>
            </div>
        </div>
    </div>

    <!-- Halaman Utama Aplikasi -->
    <div id="app-page" class="hidden h-screen flex overflow-hidden bg-slate-50">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-sm transform transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static flex flex-col border-r border-slate-200">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-white">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm">
                        <i class="fas fa-graduation-cap text-white text-sm"></i>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800 tracking-tight">Hamdi Studio</h2>
                </div>
                <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-times text-lg"></i></button>
            </div>
            
            <div class="p-5 border-b border-slate-200 bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-sm border border-blue-200" id="user-avatar">
                        M
                    </div>
                    <div>
                        <p id="user-name-display" class="text-sm font-bold text-slate-800 line-clamp-1"></p>
                        <p id="user-role-display" class="text-xs font-medium text-slate-500 capitalize mt-0.5"></p>
                    </div>
                </div>
            </div>

            <div class="overflow-y-auto flex-1 p-4 custom-scrollbar" id="sidebar-menu">
                <!-- Menu render via JS -->
            </div>

            <div class="p-4 border-t border-slate-200 bg-white">
                <button id="logout-btn" class="w-full flex items-center justify-center p-2.5 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all">
                    <i class="fas fa-sign-out-alt mr-2"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <!-- Header Mobile -->
            <header class="bg-white shadow-sm border-b border-slate-200 p-4 flex items-center md:hidden shrink-0 sticky top-0 z-40">
                <button id="open-sidebar" class="text-slate-600 focus:outline-none p-1 mr-3"><i class="fas fa-bars text-lg"></i></button>
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-graduation-cap text-white text-xs"></i>
                    </div>
                    <h1 class="text-base font-bold text-slate-800">Hamdi Studio</h1>
                </div>
            </header>

            <!-- Tempat Konten Utama -->
            <div id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                <!-- Konten dinamis -->
            </div>
        </main>
    </div>
