    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Halaman Login Premium (Clean & Light Mode) -->

        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] max-w-md w-full relative z-10 border border-slate-100">

            </div>
            
            <div id="login-error" class="hidden bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl mb-6 text-sm text-center flex items-center justify-center font-medium">

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Alamat Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-slate-400 text-sm"></i>
                        </div>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 outline-none transition-all text-sm font-medium" placeholder="mail@example.com" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400 text-sm"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 outline-none transition-all text-sm font-medium" placeholder="••••••••" required>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="https://wa.me/6282298363945" target="_blank" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">Lupa sandi?</a>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl hover:bg-indigo-700 transition-all font-semibold shadow-sm shadow-indigo-200 mt-2 text-sm">
                    Masuk ke Portal
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 mb-3 font-medium">Belum memiliki akses premium?</p>
                <a href="https://wa.me/6282298363945" target="_blank" class="inline-flex items-center justify-center px-5 py-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600 rounded-xl font-semibold transition-all w-full text-sm">
                    <i class="fab fa-whatsapp text-emerald-500 text-lg mr-2"></i> Hubungi Admin
                </a>
            </div>
        </div>
    </div>

    <!-- Halaman Utama Aplikasi -->

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static flex flex-col">
            <!-- Brand -->

                    <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow-sm">
                        <i class="fas fa-graduation-cap text-white text-sm"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-slate-800 tracking-tight leading-none">Hamdi Studio</h2>
                        <p class="text-[10px] uppercase tracking-widest text-indigo-500 font-bold mt-1">Premium Class</p>
                    </div>
                </div>
                <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-slate-600 bg-slate-50 p-2 rounded-lg"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- User Profile -->
            <div class="p-4 mx-4 mt-2 rounded-xl bg-slate-50 border border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold shadow-sm border border-indigo-200" id="user-avatar">M</div>
                    <div class="flex-1 overflow-hidden">
                        <p id="user-name-display" class="text-sm font-bold text-slate-800 truncate"></p>
                        <p id="user-role-display" class="text-xs font-semibold text-slate-500 truncate"></p>
                    </div>
                </div>
            </div>

            <!-- Menu Navigation -->
            <div class="overflow-y-auto flex-1 p-4 custom-scrollbar" id="sidebar-menu"></div>

            <div class="p-4 border-t border-slate-100">
                <button id="logout-btn" class="w-full flex items-center justify-center p-2.5 text-sm font-semibold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 hover:text-red-600 transition-all shadow-sm">
                    <i class="fas fa-sign-out-alt mr-2"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <!-- Header Mobile -->
            <header class="bg-white shadow-sm border-b border-slate-200 p-4 flex items-center justify-between md:hidden shrink-0 sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button id="open-sidebar" class="text-slate-600 p-2 bg-slate-50 rounded-lg border border-slate-100"><i class="fas fa-bars"></i></button>
                    <h1 class="text-base font-bold text-slate-800">Hamdi Studio</h1>
                </div>
            </header>

            <!-- Main Workspace -->
            <div id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative">
                <!-- Konten dinamis -->
