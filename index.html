<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-indigo-500/10 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-emerald-500/10 blur-3xl pointer-events-none"></div>

    <div class="hes-card !p-8 sm:!p-10 max-w-md w-full relative z-10 fade-in">
        <div class="text-center mb-7">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200 text-white text-2xl">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Halo, Selamat Datang! 👋</h1>
            <p class="text-slate-500 font-medium text-sm mt-1">Masuk ke ruang belajar Hamdi English Studio</p>
        </div>

        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 p-3.5 rounded-2xl mb-5 text-xs font-bold flex items-center gap-2.5 animate-shake">
            <i class="fas fa-circle-exclamation text-base"></i>
            <span>Email atau kata sandi belum tepat. Coba periksa lagi ya!</span>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-bold text-slate-600 mb-1.5">Alamat Email</label>
                <input type="email" id="email" class="hes-input" placeholder="nama@email.com" required autocomplete="email">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-bold text-slate-600">Kata Sandi</label>
                    <a href="https://wa.me/6282298363945" target="_blank" class="text-xs font-bold text-indigo-600 hover:underline">Lupa sandi?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" class="hes-input pr-11" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="hes-btn-primary w-full !py-3.5 mt-2">
                <span>Masuk Sekarang</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-7 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400 font-semibold mb-3">Butuh bantuan atau belum punya akun?</p>
            <a href="https://wa.me/6282298363945" target="_blank" class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs transition">
                <i class="fab fa-whatsapp text-base"></i> Chat Admin di WhatsApp
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
