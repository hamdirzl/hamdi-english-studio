                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">

                        </div>
                        <input type="password" id="password" class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all" placeholder="••••••••" required>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all font-semibold shadow-lg shadow-indigo-200 transform hover:-translate-y-0.5 mt-2">
