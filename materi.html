<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200/80 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="bg-white/90 backdrop-blur-md border-b border-slate-200/70 px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto fade-in pb-16 space-y-6">

                <!-- Banner Pintas Sesi Aktif -->
                <div id="materi-session-tracker-banner" class="hidden"></div>

                <!-- Header & Pemilih Sesi Belajar -->
                <div class="hes-card flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span id="materi-badge" class="px-2.5 py-0.5 bg-indigo-50 text-indigo-600 text-xs font-extrabold rounded-lg">Month 1</span>
                            <span id="materi-subbadge" class="text-xs font-bold text-slate-400">Week 1 • Day 1</span>
                            <span id="materi-date-pill" class="hidden text-xs font-extrabold px-2.5 py-0.5 rounded-lg"></span>
                        </div>
                        <h2 id="materi-title" class="text-lg sm:text-xl font-extrabold text-slate-800">Materi Kelas Harian</h2>
                    </div>

                    <!-- Dropdown Pilih Bulan, Minggu, Hari -->
                    <div class="grid grid-cols-3 gap-2 w-full md:w-auto">
                        <select id="quick-month" class="hes-input !py-2 !px-3 !text-xs cursor-pointer"></select>
                        <select id="quick-week" class="hes-input !py-2 !px-3 !text-xs cursor-pointer"></select>
                        <select id="quick-day" class="hes-input !py-2 !px-3 !text-xs cursor-pointer"></select>
                    </div>
                </div>

                <!-- Kartu Hafalan Kosakata (Flashcard 3D) -->
                <section id="vocab-section" class="hidden hes-card">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-base sm:text-lg font-extrabold text-slate-800">🎯 Kartu Kosakata Harian</h3>
                                <span id="vocab-count-badge" class="text-xs font-extrabold bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full">0 Kata</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">Ketuk kartu untuk melihat arti bahasa Indonesia, atau geser untuk kata berikutnya.</p>
                        </div>
                        <button type="button" onclick="shuffleVocabCards()" class="hes-btn-soft self-start sm:self-auto">
                            <i class="fas fa-shuffle"></i> Acak Kartu
                        </button>
                    </div>

                    <div id="vocab-cards-container" class="py-2"></div>
                    <div id="vocab-action-area" class="mt-6 pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3"></div>
                </section>

                <!-- Modul Presentasi Utama -->
                <section class="hes-card">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-red-50 text-red-500 flex items-center justify-center"><i class="fas fa-book-open"></i></span>
                            <span>Modul Bacaan & Presentasi</span>
                        </h3>
                        <a id="presentation-external-link" href="#" target="_blank" class="hidden hes-btn-soft">
                            <i class="fas fa-up-right-from-square"></i> Buka Layar Penuh
                        </a>
                    </div>
                    <div id="presentation-viewer-box"></div>
                </section>

                <!-- Catatan Rangkuman (Recap) -->
                <section class="hes-card">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2.5">
                            <span class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><i class="fas fa-clipboard-check"></i></span>
                            <span>Catatan Rangkuman Kelas (Recap)</span>
                        </h3>
                        <a id="recap-external-link" href="#" target="_blank" class="hidden hes-btn-soft !bg-emerald-50 !text-emerald-700">
                            <i class="fas fa-up-right-from-square"></i> Buka Layar Penuh
                        </a>
                    </div>
                    <div id="recap-viewer-box"></div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/wordbank.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/materi.js"></script>
</body>
</html>
