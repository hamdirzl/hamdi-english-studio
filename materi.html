<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Pembelajaran | Hamdi English Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4f46e5' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div class="h-screen flex overflow-hidden bg-[#F8FAFC]">
        
        <!-- Sidebar (Dirender oleh js/layout.js) -->
        <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 transform transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

        <!-- Area Konten Utama -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            <!-- Header (Dirender oleh js/layout.js) -->
            <header id="app-header" class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

            <!-- Konten Materi -->
            <div class="flex-1 overflow-y-auto p-3.5 sm:p-5 md:p-8 custom-scrollbar">
                <div class="max-w-5xl mx-auto fade-in pb-16">

                    <!-- Bilah Pelacak Kompak (Compact Session Tracker) -->
                    <div id="materi-session-tracker-banner" class="hidden mb-4"></div>

                    <!-- Bar Navigasi & Quick Selector Modul -->
                    <div class="bg-white p-3.5 sm:p-5 rounded-2xl border border-slate-200/90 shadow-sm mb-5 flex flex-col md:flex-row md:items-center justify-between gap-3.5">
                        <div class="flex items-start sm:items-center gap-3">
                            <a href="dashboard.html" class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl flex items-center justify-center text-slate-600 transition" title="Kembali ke Dashboard">
                                <i class="fas fa-arrow-left text-xs sm:text-sm"></i>
                            </a>
                            <div class="min-w-0 flex-1">
                                <div class="flex flex-wrap items-center gap-1.5">
                                    <span id="materi-badge" class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-extrabold uppercase tracking-wider rounded border border-indigo-100">Month 1</span>
                                    <span id="materi-subbadge" class="text-[11px] font-bold text-slate-400">Week 1 • Day 1</span>
                                    <span id="materi-date-pill" class="hidden text-[10px] font-extrabold px-2 py-0.5 rounded border"></span>
                                </div>
                                <h2 id="materi-title" class="text-sm sm:text-base md:text-lg font-extrabold text-slate-800 mt-1 truncate">Modul Pembelajaran Harian</h2>
                            </div>
                        </div>

                        <!-- Selector Cepat Pindah Sesi (3 Kolom Rata di HP) -->
                        <div class="grid grid-cols-3 sm:flex items-center gap-2 w-full md:w-auto pt-2.5 md:pt-0 border-t md:border-t-0 border-slate-100">
                            <select id="quick-month" class="w-full sm:w-auto bg-slate-50 border border-slate-200 px-2.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer truncate"></select>
                            <select id="quick-week" class="w-full sm:w-auto bg-slate-50 border border-slate-200 px-2.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer truncate">
                                <option value="1">Week 1</option>
                                <option value="2">Week 2</option>
                                <option value="3">Week 3</option>
                                <option value="4">Week 4</option>
                            </select>
                            <select id="quick-day" class="w-full sm:w-auto bg-slate-50 border border-slate-200 px-2.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer truncate">
                                <option value="1">Day 1</option>
                                <option value="2">Day 2</option>
                                <option value="3">Day 3</option>
                            </select>
                        </div>
                    </div>

                    <!-- Section Daily Vocabulary (Interactive 3D Flashcards + Audio) -->
                    <section id="vocab-section" class="hidden mb-5 bg-white p-4 sm:p-6 rounded-2xl border border-slate-200/90 shadow-sm">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="text-xs sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
                                        <i class="fas fa-layer-group text-indigo-600"></i>
                                        Interactive Vocabulary Flashcards
                                    </h3>
                                    <span id="vocab-count-badge" class="shrink-0 text-[10px] font-extrabold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md border border-indigo-100">0 Kata</span>
                                </div>
                                <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5">
                                    Ketuk kartu untuk membalik arti <span class="text-indigo-600 font-semibold">(3D Flip)</span> atau klik ikon <i class="fas fa-volume-high text-indigo-500 mx-0.5"></i> untuk mendengar pengucapan.
                                </p>
                            </div>

                            <!-- Toolbar Kontrol Flashcard -->
                            <div class="flex items-center gap-1.5 self-start sm:self-auto">
                                <button type="button" onclick="toggleFlipAllCards()" id="btn-flip-all" class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 hover:border-indigo-200 text-[11px] font-bold transition flex items-center gap-1.5">
                                    <i class="fas fa-rotate"></i> <span>Balik Semua</span>
                                </button>
                                <button type="button" onclick="shuffleVocabCards()" class="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-amber-50 text-slate-600 hover:text-amber-700 border border-slate-200 hover:border-amber-200 text-[11px] font-bold transition flex items-center gap-1.5">
                                    <i class="fas fa-shuffle"></i> <span>Acak</span>
                                </button>
                            </div>
                        </div>

                        <!-- Deretan Kartu Kosakata 3D -->
                        <div id="vocab-cards-container" class="flex overflow-x-auto gap-3 sm:gap-3.5 pb-3.5 pt-1 snap-x bg-slate-50/80 p-3 sm:p-4 rounded-2xl border border-slate-100 custom-scrollbar">
                            <!-- Diisi oleh js/materi.js -->
                        </div>

                        <!-- Area Tombol Submit / Status Verifikasi Hafalan -->
                        <div id="vocab-action-area" class="mt-3.5 pt-3 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-2.5">
                            <!-- Diisi oleh js/materi.js -->
                        </div>
                    </section>

                    <!-- Grid Dokumen PDF (Modul Presentasi & Catatan Rangkuman) -->
                    <div class="grid grid-cols-1 gap-5">
                        
                        <!-- Modul Presentasi -->
                        <section class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200/90 shadow-sm">
                            <div class="flex items-center justify-between mb-3.5">
                                <h3 class="text-xs sm:text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-red-50 text-red-500 flex items-center justify-center shrink-0"><i class="fas fa-file-pdf text-xs sm:text-sm"></i></span>
                                    <span>Modul Presentasi Utama</span>
                                </h3>
                                <a id="presentation-external-link" href="#" target="_blank" class="hidden shrink-0 text-[11px] font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 px-2.5 py-1.5 rounded-lg border border-indigo-100 transition">
                                    <i class="fas fa-external-link-alt mr-1"></i> Layar Penuh
                                </a>
                            </div>
                            <div id="presentation-viewer-box">
                                <!-- Diisi oleh js/materi.js -->
                            </div>
                        </section>

                        <!-- Catatan Rangkuman (Recap) -->
                        <section class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200/90 shadow-sm">
                            <div class="flex items-center justify-between mb-3.5">
                                <h3 class="text-xs sm:text-base font-bold text-slate-800 flex items-center gap-2">
                                    <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i class="fas fa-clipboard-check text-xs sm:text-sm"></i></span>
                                    <span>Catatan Rangkuman (Recap)</span>
                                </h3>
                                <a id="recap-external-link" href="#" target="_blank" class="hidden shrink-0 text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-2.5 py-1.5 rounded-lg border border-emerald-100 transition">
                                    <i class="fas fa-external-link-alt mr-1"></i> Layar Penuh
                                </a>
                            </div>
                            <div id="recap-viewer-box">
                                <!-- Diisi oleh js/materi.js -->
                            </div>
                        </section>

                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Library Supabase & Script Halaman -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/materi.js"></script>
</body>
</html>
