<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="backdrop-blur-md px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto fade-in pb-16 space-y-5">

                <!-- Header Pertemuan + Prev / Next + Bar 12 Sesi -->
                <div class="hes-card space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span id="materi-badge" class="px-2.5 py-0.5 bg-teal-50 text-teal-700 border border-teal-200 text-xs font-extrabold rounded-lg">Month 1</span>
                                <span id="materi-subbadge" class="text-xs font-extrabold text-stone-400">Minggu 1 &bull; Hari 1</span>
                                <span id="materi-date-pill" class="hidden text-xs font-extrabold px-2.5 py-0.5 rounded-lg"></span>
                            </div>
                            <h2 id="materi-title" class="text-lg sm:text-xl font-extrabold text-stone-800">Pertemuan 1</h2>
                        </div>

                        <div class="flex items-center gap-2">
                            <button id="btn-prev-session" onclick="navigateAdjacentSession(-1)" class="hes-btn-soft !py-2 !px-3.5">
                                <i class="fas fa-arrow-left"></i> <span>Sebelumnya</span>
                            </button>
                            <button id="btn-next-session" onclick="navigateAdjacentSession(1)" class="hes-btn-primary !py-2 !px-3.5">
                                <span>Selanjutnya</span> <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Bar Lompat Cepat Sesi 1 s/d 12 -->
                    <div class="pt-3 border-t border-stone-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11px] font-extrabold text-stone-400 uppercase">Pindah Cepat Pertemuan (Sesi 1–12):</span>
                            <select id="quick-month" class="text-xs font-extrabold text-teal-700 bg-teal-50 border border-teal-200 px-2.5 py-1 rounded-lg outline-none cursor-pointer"></select>
                        </div>
                        <div id="session-stepping-stones" class="grid grid-cols-6 sm:grid-cols-12 gap-1.5"></div>
                    </div>
                </div>

                <!-- Kotak Materi Terkunci (Muncul jika belum hari-H / belum dijadwalkan untuk Murid) -->
                <section id="materi-locked-box" class="hidden"></section>

                <!-- Konten Materi Aktif (2 Tab Bersih: Modul Materi & Catatan Recap) -->
                <div id="materi-unlocked-wrapper" class="space-y-5">
                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                        <button onclick="switchMateriMode('presentation')" id="mode-btn-presentation" class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-2 cursor-pointer"></button>
                        <button onclick="switchMateriMode('recap')" id="mode-btn-recap" class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-2 cursor-pointer"></button>
                    </div>

                    <section id="panel-materi-presentation">
                        <div id="presentation-viewer-box"></div>
                    </section>

                    <section id="panel-materi-recap" class="hidden">
                        <div id="recap-viewer-box"></div>
                    </section>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=12"></script>
    <script src="js/layout.js?v=12"></script>
    <script src="js/materi.js?v=12"></script>
</body>
</html>
