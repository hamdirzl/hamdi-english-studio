<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200/80 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="bg-white/90 backdrop-blur-md border-b border-slate-200/70 px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto fade-in pb-16 space-y-5">

                <!-- Header Pertemuan + Tombol Prev / Next Pertemuan + Bar 12 Sesi -->
                <div class="hes-card space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span id="materi-badge" class="px-2.5 py-0.5 bg-indigo-100 text-indigo-700 text-xs font-black rounded-lg">Month 1</span>
                                <span id="materi-subbadge" class="text-xs font-extrabold text-slate-400">Minggu 1 &bull; Hari 1</span>
                                <span id="materi-date-pill" class="hidden text-xs font-black px-2.5 py-0.5 rounded-lg"></span>
                            </div>
                            <h2 id="materi-title" class="text-lg sm:text-xl font-black text-slate-800">Pertemuan 1</h2>
                        </div>

                        <!-- Tombol 1-Klik Pertemuan Sebelumnya & Selanjutnya -->
                        <div class="flex items-center gap-2">
                            <button id="btn-prev-session" onclick="navigateAdjacentSession(-1)" class="hes-btn-soft !py-2 !px-3.5 cursor-pointer">
                                <i class="fas fa-arrow-left"></i> <span>Sebelumnya</span>
                            </button>
                            <button id="btn-next-session" onclick="navigateAdjacentSession(1)" class="hes-btn-primary !py-2 !px-3.5 cursor-pointer">
                                <span>Selanjutnya</span> <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Bar Lompat Cepat Sesi 1 s/d 12 -->
                    <div class="pt-3 border-t border-slate-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11px] font-black text-slate-400 uppercase">Pindah Cepat Pertemuan (Sesi 1–12):</span>
                            <select id="quick-month" class="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg outline-none cursor-pointer"></select>
                        </div>
                        <div id="session-stepping-stones" class="grid grid-cols-6 sm:grid-cols-12 gap-1.5"></div>
                    </div>
                </div>

                <!-- 3 Tab Mode Belajar -->
                <div class="grid grid-cols-3 gap-2 sm:gap-3">
                    <button onclick="switchMateriMode('vocab')" id="mode-btn-vocab" class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 cursor-pointer"></button>
                    <button onclick="switchMateriMode('presentation')" id="mode-btn-presentation" class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 cursor-pointer"></button>
                    <button onclick="switchMateriMode('recap')" id="mode-btn-recap" class="py-3 px-3 rounded-2xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 cursor-pointer"></button>
                </div>

                <!-- PANEL 1: KOSAKATA & KUIS -->
                <section id="panel-materi-vocab" class="hes-card">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 pb-4 border-b border-slate-100">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-base sm:text-lg font-black text-slate-800"><i class="fas fa-spell-check text-indigo-600 mr-1.5"></i> Latihan Kosakata Harian</h3>
                                <span id="vocab-count-badge" class="text-xs font-black bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full">0 Kata</span>
                            </div>
                            <p class="text-xs font-bold text-slate-400 mt-0.5">Pelajari daftar kosakata dengan suara, lalu uji ingatanmu di mode kuis!</p>
                        </div>

                        <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                            <button onclick="switchVocabSubmode('list')" id="submode-deck" class="px-3 py-1.5 rounded-lg text-xs font-black transition cursor-pointer"><i class="fas fa-list-ul mr-1"></i> Daftar Kata</button>
                            <button onclick="switchVocabSubmode('quiz')" id="submode-quiz" class="px-3 py-1.5 rounded-lg text-xs font-black transition cursor-pointer"><i class="fas fa-gamepad mr-1"></i> Kuis Singkat</button>
                        </div>
                    </div>

                    <div id="vocab-cards-container" class="py-2"></div>
                    <div id="vocab-action-area" class="mt-6 pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3"></div>
                </section>

                <!-- PANEL 2: MODUL MATERI UTAMA (REPORT-STYLE HANDOUT) -->
                <section id="panel-materi-presentation" class="hidden">
                    <div id="presentation-viewer-box"></div>
                </section>

                <!-- PANEL 3: CATATAN RECAP KELAS (REPORT-STYLE HANDOUT) -->
                <section id="panel-materi-recap" class="hidden">
                    <div id="recap-viewer-box"></div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/wordbank.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/materi.js?v=8"></script>
</body>
</html>
