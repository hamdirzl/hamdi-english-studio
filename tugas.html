<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Speaking | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="backdrop-blur-md px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto fade-in pb-20 space-y-6">

                <!-- Header Tugas Speaking -->
                <div class="bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 rounded-3xl p-6 sm:p-7 text-white shadow-md relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-44 h-44 bg-white/15 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/20 rounded-full text-xs font-extrabold mb-2">
                                <i class="fas fa-microphone-lines"></i> Conversation Practice Studio
                            </span>
                            <h2 class="text-xl sm:text-2xl font-extrabold">Tugas Speaking & Conversation</h2>
                            <p class="text-amber-50 text-xs sm:text-sm font-semibold mt-1">Baca instruksi dengan santai, rekam suaramu dalam bahasa Inggris, lalu kirim ke tutor!</p>
                        </div>
                        <div id="tasks-summary-pill" class="bg-white/20 backdrop-blur-xs px-4 py-2.5 rounded-2xl text-xs font-extrabold text-center shrink-0">
                            Memuat tugas...
                        </div>
                    </div>
                </div>

                <!-- Filter Status (Murid) -->
                <div id="tasks-filter-bar" class="hidden flex flex-wrap gap-2">
                    <button onclick="setTaskFilter('all')" id="task-flt-all" class="px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer"></button>
                    <button onclick="setTaskFilter('todo')" id="task-flt-todo" class="px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer"></button>
                    <button onclick="setTaskFilter('done')" id="task-flt-done" class="px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer"></button>
                </div>

                <!-- Daftar Tugas -->
                <div id="tasks-list-container" class="space-y-4"></div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=12"></script>
    <script src="js/layout.js?v=12"></script>
    <script src="js/tugas.js?v=12"></script>
</body>
</html>
