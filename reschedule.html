<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Jadwal | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200/80 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="bg-white/90 backdrop-blur-md border-b border-slate-200/70 px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-5xl mx-auto fade-in pb-14 space-y-6">

                <div class="hes-card flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-lg sm:text-xl font-extrabold text-slate-800">🗓️ Pindah Jadwal Kelas</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Berhalangan hadir? Pilih jadwalmu dan cari hari pengganti di minggu yang sama.</p>
                    </div>
                    <div id="reschedule-time-badge" class="hes-btn-soft self-start sm:self-auto">Jam Kelas: -</div>
                </div>

                <div id="reschedule-alert-box" class="hidden"></div>

                <section id="reschedule-controls" class="hidden hes-card">
                    <label for="reschedule-old-day" class="block text-xs font-extrabold text-slate-600 uppercase mb-2">1. Pilih Jadwal yang Ingin Kamu Pindahkan:</label>
                    <select id="reschedule-old-day" class="hes-input max-w-md cursor-pointer"></select>
                </section>

                <div id="reschedule-grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/reschedule.js"></script>
</body>
</html>
