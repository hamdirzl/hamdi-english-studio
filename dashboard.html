<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="min-h-screen flex flex-col">

    <header id="app-header"></header>

    <main class="flex-1 p-4 sm:p-6 md:p-8 pb-24">
        <div class="max-w-5xl mx-auto fade-in space-y-6">

            <!-- TAMPILAN MURID -->
            <section id="student-dashboard-view" class="hidden space-y-6">
                <!-- Sapaan & Tiket Kelas Aktif -->
                <div id="student-welcome-ticket"></div>

                <!-- Peta 12 Pertemuan (Bebas Ulang Materi Lama 1-Klik) -->
                <div id="student-journey-map-box"></div>

                <!-- Ringkasan Pencapaian -->
                <div id="student-gamification-box"></div>
            </section>

            <!-- TAMPILAN ADMIN -->
            <section id="admin-dashboard-view" class="hidden space-y-6">
                <div class="hes-card !bg-gradient-to-r from-emerald-700 to-teal-800 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-200">Admin Studio</span>
                        <h2 class="text-2xl font-extrabold mt-0.5">Halo, Bro Hamdi! ☕</h2>
                        <p class="text-xs text-emerald-100 mt-1">Berikut adalah ringkasan kelas dan jadwal mengajar 7 hari ke depan.</p>
                    </div>
                    <a href="admin.html" class="hes-btn-soft !bg-white !text-emerald-900 !border-emerald-200 shrink-0">
                        <i class="fas fa-sliders"></i> Buka Panel Admin
                    </a>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="hes-card flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl"><i class="fas fa-users"></i></div>
                        <div><p class="text-xs font-bold text-stone-400">Murid Aktif</p><p id="stat-total-students" class="text-2xl font-extrabold">0</p></div>
                    </div>
                    <div class="hes-card flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl"><i class="fas fa-book"></i></div>
                        <div><p class="text-xs font-bold text-stone-400">Total Bulan</p><p id="stat-total-months" class="text-2xl font-extrabold">0</p></div>
                    </div>
                    <div class="hes-card flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center text-xl"><i class="fas fa-bell"></i></div>
                        <div><p class="text-xs font-bold text-stone-400">Request Jadwal</p><p id="stat-pending-reschedules" class="text-2xl font-extrabold">0</p></div>
                    </div>
                </div>

                <div id="admin-reschedule-alert" class="hidden"></div>

                <div>
                    <h3 class="text-base font-extrabold text-stone-800 mb-3">📅 Jadwal Mengajar 7 Hari Ke Depan</h3>
                    <div id="admin-schedule-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/wordbank.js?v=3"></script>
    <script src="js/config.js?v=3"></script>
    <script src="js/layout.js?v=3"></script>
    <script src="js/dashboard.js?v=3"></script>
</body>
</html>
