<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="backdrop-blur-md px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-5xl mx-auto fade-in pb-14 space-y-6">

                <!-- Hero Banner Hangat -->
                <div class="bg-gradient-to-br from-teal-700 via-teal-600 to-emerald-600 rounded-3xl p-6 sm:p-8 text-white shadow-lg shadow-teal-900/15 relative overflow-hidden">
                    <div class="absolute -right-12 -top-12 w-56 h-56 bg-amber-300/20 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="absolute -left-10 -bottom-14 w-44 h-44 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-5">
                        <div>
                            <span id="hero-badge" class="inline-flex items-center gap-1.5 px-3.5 py-1 bg-white/20 backdrop-blur-xs rounded-full text-xs font-extrabold text-white mb-2.5">
                                Memuat...
                            </span>
                            <h2 id="hero-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight">Halo!</h2>
                            <p id="hero-subtitle" class="text-teal-50 text-sm font-semibold mt-1">Menyiapkan ruang belajarmu...</p>
                        </div>
                        <div id="hero-action" class="shrink-0"></div>
                    </div>
                </div>

                <!-- TAMPILAN MURID -->
                <section id="student-dashboard-view" class="hidden space-y-6">
                    <div id="student-next-session-box"></div>
                    <div id="student-journey-map-box"></div>
                    <div id="student-gamification-box"></div>
                </section>

                <!-- TAMPILAN ADMIN -->
                <section id="admin-dashboard-view" class="hidden space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 flex items-center justify-center text-xl"><i class="fas fa-user-graduate"></i></div>
                            <div>
                                <p class="text-xs font-bold text-stone-400">Total Murid</p>
                                <p id="stat-total-students" class="text-2xl font-black text-stone-800">0</p>
                            </div>
                        </div>
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl"><i class="fas fa-layer-group"></i></div>
                            <div>
                                <p class="text-xs font-bold text-stone-400">Modul Bulan</p>
                                <p id="stat-total-months" class="text-2xl font-black text-stone-800">0</p>
                            </div>
                        </div>
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl"><i class="fas fa-microphone-lines"></i></div>
                            <div>
                                <p class="text-xs font-bold text-stone-400">Tugas Belum Dinilai</p>
                                <p id="stat-pending-tasks" class="text-2xl font-black text-stone-800">0</p>
                            </div>
                        </div>
                    </div>
                    <div id="admin-task-alert" class="hidden"></div>
                    <div>
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <h3 class="text-base font-extrabold text-stone-800">Jadwal Pertemuan 7 Hari Ke Depan</h3>
                            <a href="admin.html?tab=overview" class="text-xs font-extrabold text-teal-700 hover:underline"><i class="fas fa-calendar-plus mr-1"></i> Input Tanggal Pertemuan</a>
                        </div>
                        <div id="admin-schedule-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=12"></script>
    <script src="js/layout.js?v=12"></script>
    <script src="js/dashboard.js?v=12"></script>
</body>
</html>
