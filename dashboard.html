<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda | Hamdi English Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <aside id="app-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200/80 -translate-x-full md:translate-x-0 md:static flex flex-col shrink-0"></aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="app-header" class="bg-white/90 backdrop-blur-md border-b border-slate-200/70 px-4 md:px-8 py-3.5 flex items-center justify-between shrink-0 sticky top-0 z-30"></header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 custom-scrollbar">
            <div class="max-w-5xl mx-auto fade-in pb-14 space-y-6">

                <!-- Hero Banner Hangat -->
                <div class="bg-gradient-to-r from-indigo-600 via-indigo-600 to-violet-600 rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-5">
                        <div>
                            <span id="hero-badge" class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/20 rounded-full text-xs font-extrabold text-white mb-2.5">
                                Memuat...
                            </span>
                            <h2 id="hero-title" class="text-2xl sm:text-3xl font-black">Halo! 👋</h2>
                            <p id="hero-subtitle" class="text-indigo-100 text-sm font-semibold mt-1">Menyiapkan ruang belajarmu...</p>
                        </div>
                        <div id="hero-action" class="shrink-0"></div>
                    </div>
                </div>

                <!-- TAMPILAN MURID -->
                <section id="student-dashboard-view" class="hidden space-y-6">
                    <div id="student-next-session-box"></div>
                    <div id="student-journey-map-box"></div>
                    <div id="student-gamification-box"></div>
                </section>

                <!-- TAMPILAN ADMIN -->
                <section id="admin-dashboard-view" class="hidden space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl"><i class="fas fa-user-graduate"></i></div>
                            <div>
                                <p class="text-xs font-bold text-slate-400">Total Murid</p>
                                <p id="stat-total-students" class="text-2xl font-black text-slate-800">0</p>
                            </div>
                        </div>
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl"><i class="fas fa-layer-group"></i></div>
                            <div>
                                <p class="text-xs font-bold text-slate-400">Modul Bulan</p>
                                <p id="stat-total-months" class="text-2xl font-black text-slate-800">0</p>
                            </div>
                        </div>
                        <div class="hes-card flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl"><i class="fas fa-bell"></i></div>
                            <div>
                                <p class="text-xs font-bold text-slate-400">Request Jadwal</p>
                                <p id="stat-pending-reschedules" class="text-2xl font-black text-slate-800">0</p>
                            </div>
                        </div>
                    </div>
                    <div id="admin-reschedule-alert" class="hidden"></div>
                    <div>
                        <h3 class="text-base font-black text-slate-800 mb-3">Jadwal Mengajar 7 Hari Ke Depan</h3>
                        <div id="admin-schedule-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/wordbank.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
